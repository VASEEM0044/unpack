name: Unpack
options:
  bundleIdPrefix: com.unpack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Unpack:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Configuration/Assets.xcassets
    dependencies:
      - target: ShareExtension
    settings:
      base:
        PRODUCT_NAME: Unpack
        PRODUCT_BUNDLE_IDENTIFIER: com.unpack.app
        INFOPLIST_FILE: Configuration/Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Unpack.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extensions/ShareExtension
    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.unpack.app.share
        INFOPLIST_FILE: Extensions/ShareExtension/ShareExtension-Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO

  UnpackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Unpack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unpack.app.tests
        GENERATE_INFOPLIST_FILE: YES
