name: Build Unsigned IPA (TrollStore / Sideloading)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build Unpack.ipa
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Highest Xcode Version (Xcode 16 / Swift 6)
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode.app 2>/dev/null | head -n 1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | head -n 1)
          fi
          echo "Selected Xcode: $XCODE_APP"
          sudo xcode-select -switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install Tools
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build App for iOS (Device)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project Unpack.xcodeproj \
            -scheme Unpack \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="${{ github.workspace }}/build"

      - name: Package Unsigned IPA for TrollStore
        run: |
          APP_DIR=$(find "${{ github.workspace }}/build" -type d -name "Unpack.app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: Unpack.app not found in build directory!"
            exit 1
          fi
          echo "Found app at: $APP_DIR"

          mkdir -p Payload
          cp -R "$APP_DIR" Payload/

          # If ldid is available, ad-hoc sign for maximum compatibility
          if which ldid > /dev/null 2>&1; then
            ldid -S Payload/Unpack.app
          fi

          zip -r -9 Unpack.ipa Payload
          echo "Successfully created Unpack.ipa"
          ls -lh Unpack.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unpack-TrollStore-IPA
          path: Unpack.ipa
          if-no-files-found: error
          retention-days: 14
